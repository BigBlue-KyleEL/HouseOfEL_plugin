name: HoEL-Builder
version: 0.1.0
main: com.houseofel.builder.HoELBuilder
api-version: '1.13'
author: Kyle
description: House of EL - Builder module (Helper NPC builder/gatherer companion systems)
depend: [Citizens, HoEL-Core]
softdepend: [floodgate, BetterModel]
commands:
  builder:
    description: Manage Helper (builder/gatherer) NPCs
    usage: /builder spawn|confirm|cancel|testmenu <npcId> [specialization] [tier] [player]
  helpermodel:
    description: Inspect or preview Groundworker visuals (no gameplay changes)
    usage: /helpermodel status|play <npcId> <clip>
permissions:
  houseofel.builder.modeltest:
    description: Inspect and preview custom Helper model animations
    default: false
  houseofel.builder.spawn:
    description: Allows spawning a Helper NPC
    default: false

  houseofel.builder.testbusy:
    description: Allows previewing the busy menu without creating jobs
    default: false

  houseofel.builder.testmenu:
    description: Allows previewing main-menu class logos without changing NPC data
    default: false
